<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidhi's To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" aria-labelledby="page-title">
    <h1 id="page-title">Vidhi's To-Do List</h1>

    <form id="todo-form" class="todo-form">
      <label class="sr-only" for="todo-input">New task</label>
      <input id="todo-input" type="text" placeholder="What needs to be done?" autocomplete="off" required>
      <button type="submit">Add task</button>
    </form>

    <p id="todo-count" class="todo-count" aria-live="polite">0 tasks</p>
    <ul id="todo-list" class="todo-list" aria-label="Tasks"></ul>
    <p id="empty-state" class="empty-state">No tasks yet. Add one above.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
