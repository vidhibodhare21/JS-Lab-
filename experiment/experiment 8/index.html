<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iron House Gym | Admission</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">IRON HOUSE GYM</p>
      <h1 id="page-title">Start your stronger routine.</h1>
      <p class="intro-copy">Complete the admission form and we’ll help you choose a membership that fits your week.</p>
      <div class="hours" aria-label="Gym opening hours">
        <span>Open 05:30–22:00</span>
        <span>Mon–Sun</span>
      </div>
    </section>

    <section class="form-card" aria-labelledby="form-title">
      <div class="form-heading">
        <div>
          <p class="eyebrow">NEW MEMBER</p>
          <h2 id="form-title">Gym admission form</h2>
        </div>
        <span class="step">01 / 01</span>
      </div>

      <form id="admission-form" novalidate>
        <div class="field-grid">
          <div class="field full-width">
            <label for="full-name">Full name</label>
            <input id="full-name" name="fullName" type="text" autocomplete="name" placeholder="Alex Morgan" required minlength="2">
            <p class="field-message" id="full-name-message" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="alex@example.com" required>
            <p class="field-message" id="email-message" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="98765 43210" required>
            <p class="field-message" id="phone-message" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="age">Age</label>
            <input id="age" name="age" type="number" min="10" placeholder="18" required>
            <p class="field-message" id="age-message" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="plan">Membership plan</label>
            <select id="plan" name="plan" required>
              <option value="">Choose a plan</option>
              <option value="monthly">Monthly · $39</option>
              <option value="quarterly">Quarterly · $99</option>
              <option value="annual">Annual · $299</option>
            </select>
            <p class="field-message" id="plan-message" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="start-date">Preferred start date</label>
            <input id="start-date" name="startDate" type="date" required>
            <p class="field-message" id="start-date-message" aria-live="polite"></p>
          </div>
        </div>

        <label class="consent-row" for="consent">
          <input id="consent" name="consent" type="checkbox" required>
          <span>I agree to the gym rules and membership terms.</span>
        </label>
        <p class="field-message consent-message" id="consent-message" aria-live="polite"></p>

        <button type="submit">Request admission <span aria-hidden="true">→</span></button>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
