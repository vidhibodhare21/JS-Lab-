<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scholarship Eligibility</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="card">
    <h1>Scholarship Eligibility</h1>
    <p>Enter your marks to check your scholarship level.</p>

    <form id="scholarshipForm">
      <label for="marks">Marks</label>
      <input type="number" id="marks" min="0" max="100" placeholder="e.g. 88" required />
      <button type="submit">Check Eligibility</button>
    </form>

    <div id="result" class="result">Your result will appear here.</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
