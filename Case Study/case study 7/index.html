<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Handling in JavaScript</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">JavaScript case study 07</p>
      <h1 id="page-title">Join the study circle</h1>
      <p class="intro-copy">A simple form demonstrating element access, input validation, and common form events.</p>
    </section>

    <section class="form-panel" aria-labelledby="form-title">
      <div class="panel-heading">
        <div>
          <p class="section-label">Registration form</p>
          <h2 id="form-title">Your details</h2>
        </div>
        <span class="required-note">* Required</span>
      </div>

      <form id="registrationForm" novalidate>
        <div class="field-group">
          <label for="fullName">Full name <span>*</span></label>
          <input type="text" id="fullName" name="fullName" placeholder="e.g. Aanya Sharma">
          <small class="error-message" id="nameError"></small>
        </div>

        <div class="field-group">
          <label for="prn">PRN / Roll number <span>*</span></label>
          <input type="text" id="prn" name="prn" placeholder="e.g. 2024012345">
          <small class="error-message" id="prnError"></small>
        </div>

        <div class="field-group">
          <label for="age">Age <span>*</span></label>
          <input type="number" id="age" name="age" placeholder="Minimum age: 15" min="15" max="100">
          <small class="error-message" id="ageError"></small>
        </div>

        <div class="field-group">
          <label for="phone">Phone number <span>*</span></label>
          <input type="tel" id="phone" name="phone" placeholder="10-digit phone number">
          <small class="error-message" id="phoneError"></small>
        </div>

        <div class="field-group">
          <label for="email">Email address <span>*</span></label>
          <input type="email" id="email" name="email" placeholder="you@example.com">
          <small class="error-message" id="emailError"></small>
        </div>

        <div class="field-group">
          <label for="branch">Branch <span>*</span></label>
          <select id="branch" name="branch">
            <option value="">Choose your branch</option>
            <option value="sit">SIT</option>
            <option value="sibm">SIBM</option>
            <option value="sid">SID</option>
            <option value="sls">SLS</option>
          </select>
          <small class="error-message" id="branchError"></small>
        </div>

        <div class="field-group">
          <label for="topic">Preferred topic</label>
          <select id="topic" name="topic">
            <option value="">Choose a topic</option>
            <option value="events">Events and listeners</option>
            <option value="forms">Forms and validation</option>
            <option value="dom">DOM manipulation</option>
          </select>
          <small class="field-hint" id="topicMessage">The change event will update this message.</small>
        </div>

        <button type="submit">Register interest</button>
        <p class="form-status" id="formStatus"></p>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
